<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharePoint Permissions Manager</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-shield-lock"></i>
                SharePoint Permissions Manager
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="userProfileLink">
                            <i class="bi bi-person-circle"></i>
                            <span id="userName">Loading...</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutLink">
                            <i class="bi bi-box-arrow-right"></i> Αποσύνδεση
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container-fluid py-4">
        <!-- Login Screen (shown before authentication) -->
        <div id="loginScreen" style="display: none;">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-4">
                    <div class="card shadow">
                        <div class="card-body text-center py-5">
                            <i class="bi bi-shield-lock display-1 text-primary mb-3"></i>
                            <h3 class="mb-3">SharePoint Permissions Manager</h3>
                            <p class="text-muted mb-4">
                                Διαχειριστείτε δικαιώματα σε SharePoint Sites και Φακέλους
                            </p>
                            <button class="btn btn-primary btn-lg" id="loginBtn">
                                <i class="bi bi-box-arrow-in-right"></i> Σύνδεση με Microsoft
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main App (shown after authentication) -->
        <div id="mainApp" style="display: none;">
            <!-- Tabs Navigation -->
            <ul class="nav nav-tabs mb-4" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="sites-tab" data-bs-toggle="tab" 
                            data-bs-target="#sites-panel" type="button" role="tab">
                        <i class="bi bi-building"></i> Sites
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="folders-tab" data-bs-toggle="tab" 
                            data-bs-target="#folders-panel" type="button" role="tab">
                        <i class="bi bi-folder"></i> Φάκελοι
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="shared-tab" data-bs-toggle="tab" 
                            data-bs-target="#shared-panel" type="button" role="tab">
                        <i class="bi bi-folder-share"></i> Κοινόχρηστοι Φάκελοι
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="user-lookup-tab" data-bs-toggle="tab" 
                            data-bs-target="#user-lookup-panel" type="button" role="tab">
                        <i class="bi bi-person-search"></i> Αναζήτηση Χρήστη
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="settings-tab" data-bs-toggle="tab" 
                            data-bs-target="#settings-panel" type="button" role="tab">
                        <i class="bi bi-gear"></i> Ρυθμίσεις
                    </button>
                </li>
            </ul>

            <!-- Tab Content -->
            <div class="tab-content">
                <!-- Sites Tab -->
                <div class="tab-pane fade show active" id="sites-panel" role="tabpanel">
                    <!-- Content will be rendered by SitePermissionsComponent -->
                </div>

                <!-- Folders Tab -->
                <div class="tab-pane fade" id="folders-panel" role="tabpanel">
                    <!-- Content will be rendered by FolderPermissionsComponent -->
                </div>

                <!-- Shared Folders Tab -->
                <div class="tab-pane fade" id="shared-panel" role="tabpanel">
                    <!-- Content will be rendered by SharedFoldersComponent -->
                </div>

                <!-- User Lookup Tab -->
                <div class="tab-pane fade" id="user-lookup-panel" role="tabpanel">
                    <!-- Content will be rendered by UserPermissionsLookupComponent -->
                </div>

                <!-- Settings Tab -->
                <div class="tab-pane fade" id="settings-panel" role="tabpanel">
                    <!-- Content will be rendered by SettingsComponent -->
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-light py-3 mt-5">
        <div class="container text-center text-muted">
            <small>
                SharePoint Permissions Manager v1.0.0 | 
                <a href="azure-setup-guide.md" target="_blank">Setup Guide</a>
            </small>
        </div>
    </footer>

    <!-- Scripts -->
    <!-- MSAL.js -->
    <script src="https://alcdn.msauth.net/browser/2.38.1/js/msal-browser.min.js"></script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Configuration -->
    <script src="config.js"></script>
    
    <!-- Utilities -->
    <script src="utils/constants.js"></script>
    <script src="utils/helpers.js"></script>
    <script src="utils/permission-aggregator.js"></script>
    
    <!-- Core Services -->
    <script src="auth.js"></script>
    <script src="sp-api.js"></script>
    <script src="graph-api.js"></script>
    <script src="azure-storage.js"></script>
    
    <!-- Components -->
    <script src="components/site-selector.js"></script>
    <script src="components/user-selector.js"></script>
    <script src="components/permission-modal.js"></script>
    <script src="components/site-permissions.js"></script>
    <script src="components/folder-permissions.js"></script>
    <script src="components/shared-folders.js"></script>
    <script src="components/user-permissions-lookup.js"></script>
    <script src="components/settings.js"></script>
    
    <!-- Main App -->
    <script src="app.js"></script>
</body>
</html>
